# RobuSTAM 설정 — 단일 진실 공급원(SSOT)
# W·자산순서·거래비용 등 핵심값은 여기서만 정의하고, 모든 코드가 여기서 읽는다.
# docs/state_spec.md(State 명세)와 항상 일치해야 하며, 충돌 시 state_spec.md가 우선한다.

# ── 자산 유니버스 (순서 고정, 절대 변경 금지 — CLAUDE.md §2) ──
# SPY: 미국주식 / EWY: 한국주식ETF / TLT: 미국장기채 / GLD: 금 / SHV: 초단기채(현금성)
assets: ["SPY", "EWY", "TLT", "GLD", "SHV"]

# ── State 차원 산출용 핵심 하이퍼파라미터 ──
window: 30              # W — 로그수익률 history 윈도우. state_dim = (5×W)+37 → 187 (하드코딩 금지)

# ── 거래비용 (env·backtest 공용) ──
transaction_cost: 0.001  # 편도 0.1% (CLAUDE.md §2 확정값)

# ── 데이터 수집 ──
data:
  start: "2009-10-01"    # 2010 목표구간의 지표 warm-up을 위해 약 60거래일 앞당겨 다운로드
  end: "2025-12-31"
  warmup_buffer_days: 60
  min_rows: 1000         # 수집 품질 게이트 — 이보다 적으면 수집 사고로 보고 실패시킨다
                         # (전체 기간 기대 약 4,087행. CI 레이트리밋 시 0행이 오는 사고 방지)
  raw_dir: "data/raw"
  feature_store_dir: "data/feature_store"
  meta_db: "data/feature_store/meta.sqlite"
  s3_bucket: "robustam-teamkimfour"  # 찬휘 생성 S3 버킷(팀 공용). 자격증명은 여기 금지 → .env/IAM Role
  s3_prefix: "robustam"    # S3 키 접두어
  precompute_path: "data/precompute/latest.json"  # 익일 추천 비중 (민지 precompute 생성 → 도현 API 소비, docs/data_pipeline.md §8)

# ── 피처 정의 (2주차 구현 — 이번 주엔 명세만 기록) ──
# 자산별 6개 + 시장공통 2개. 순서는 docs/state_spec.md 인덱스맵과 일치해야 함.
features:
  asset:
    ["MA_Cross_5_20", "RSI_14", "MACD_Hist", "Rolling_Vol_20", "Bollinger_Band_Width", "ROC_10"]
  market:
    ["Equity_Bond_Ratio", "Gold_Vol_Ratio"]
  params:
    sma_fast: 5
    sma_slow: 20
    rsi_length: 14
    macd: [12, 26, 9]      # [fast, slow, signal]
    vol_window: 20
    bbands: [20, 2]        # [length, std]
    roc_length: 10
    annualize_vol: false
    ebr_ma_window: 20      # Equity_Bond_Ratio: SPY/TLT 비율의 이동평균 창
    gvr_long_window: 60    # Gold_Vol_Ratio: 장기 변동성 창(단기는 vol_window)

# ── walk-forward 분할 (Expanding 방식 — 구현은 2주차) ──
# train을 2010부터 누적, test 블록을 2년 단위로 전진. fold마다 정규화 통계를 재fit한다.
#   Fold1: train 2010–2019 → test 2020–2021
#   Fold2: train 2010–2021 → test 2022–2023
#   Fold3: train 2010–2023 → test 2024–2025
split:
  mode: "expanding"
  anchor_start: "2010-01-01"
  test_blocks:
    - ["2020-01-01", "2021-12-31"]
    - ["2022-01-01", "2023-12-31"]
    - ["2024-01-01", "2025-12-31"]
  valid_days: 252         # 각 fold train 꼬리 약 1년을 validation으로 분리
  embargo_days: 34        # train 끝↔test 시작 사이 갭(≥ 최장 지표 lookback, MACD ~34) — 누수 차단

# ── 정규화 (2주차 구현) ──
# z-score 표준화. 통계량(평균·표준편차)은 각 fold 학습구간에서만 fit, 검증·테스트엔 적용만(룩어헤드 방지).
normalize:
  method: "zscore"
  returns_scope: "per_asset"    # 수익률 150칸은 자산당 단일 평균·표준편차로 정규화
  feature_scope: "per_column"   # 지표·시장 칸은 컬럼별로 정규화
  eps: 1.0e-8                    # 표준편차 0 가드(SHV 등 상수 컬럼)

# ── RL 학습 (src/models/train.py, RunPod GPU 실행 대상) ──
# 1차 알고리즘은 PPO(CLAUDE.md §3). fold_id는 §4-1 walk-forward 분할의 인덱스
# (src/data/splits.py::make_folds가 1부터 매김 — 1=Fold1, 0은 존재하지 않음).
model:
  algorithm: "PPO"
  policy: "MlpPolicy"
  fold_id: 1
  total_timesteps: 200000
  seed: 42
  action_bound: 10.0                   # SB3용 유한 bound (env 자체는 -inf~+inf 로짓, train.py가 래핑)
  mlflow_tracking_uri: "mlruns"        # 로컬 파일 스토어 (CLAUDE.md 스택: MLflow)
  mlflow_experiment: "robustam-ppo"
  model_dir: "mlruns/models"           # 학습된 policy.zip 저장 위치

# ── 추론(precompute) — src/inference/precompute.py ──
# 배포할 policy와, 그 policy가 학습된 build 통계(정규화 재현용)를 가리킨다.
# 도현 provenance(train.py가 기록하는 build run_id/fold_id)와 값이 일치해야
# 추론 시 학습과 동일한 z-score가 룩어헤드 없이 재현된다(docs/data_pipeline.md §8).
#
# ⚠️ 아래 값은 **배선 검증(wiring test) 전용**이며 성능이 검증되지 않았다.
#    RunPod 실학습 12회(fold 3 x seed 2 x timesteps 2종) 중 valid 샤프 최고값이지만
#    그 값이 -0.13으로 **음수**다 — 과매매로 거래비용이 수익을 잠식한다(이슈 #34).
#    precompute → API 배선이 도는지 확인하는 용도로만 쓰고, 실제 투자 판단 근거로
#    삼지 않는다. 성능 개선 후 재선정 필요.
#
# ⚠️ policy.zip은 학습 머신에서 반출해야 한다(gitignore 대상, 이슈 #33).
#    반면 meta.sqlite는 옮길 필요가 없다 — scaler_run_id를 비워두면 각자 build한
#    최신 run(같은 config_hash)을 자동으로 쓴다. 자세한 근거는 docs/data_pipeline.md §8-1.
inference:
  # 선택 근거: python -m src.models.select (valid_sharpe 기준, 12개 run 중 최고)
  model_path: "mlruns/models/ppo_fold1_b461a86027e2-20260718102003_50db7bc4c4a541bb843c6d58d190bee5.zip"
  # 비워두면 현재 config_hash의 최신 build run을 자동 선택한다(권장 — 머신마다 run_id가 달라짐).
  # 감사 추적을 위해 특정 build에 고정하려면 그 run_id를 명시한다.
  scaler_run_id: ""
  scaler_fold_id: 1                             # 배포 policy가 학습된 fold (1부터 — splits.py)
  model_version: "ppo-fold1-50db7bc4"           # latest.json에 기록되는 버전 태그
