# RobuSTAM 로컬 개발용 Docker Compose — fastapi + nginx(self-signed HTTPS)
# 실행 전: bash docker/nginx/generate_cert.sh 로 인증서 먼저 생성해야 nginx가 뜬다.
# 실행: docker compose up --build

services:
  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - fastapi
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
