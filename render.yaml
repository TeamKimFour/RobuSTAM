services:
  - type: web
    name: robustam-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: docker/Dockerfile.api
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: ENV
        value: production
      - key: PRECOMPUTE_S3_SYNC
        value: "true"
      - key: S3_BUCKET
        value: robustam-teamkimfour
      - key: S3_PREFIX
        value: robustam
      - key: PRECOMPUTE_SYNC_INTERVAL_SEC
        value: "300"
      - key: AWS_DEFAULT_REGION
        value: ap-northeast-2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Supabase Postgres 직접 연결 문자열(daily.yml GitHub Secret과 동일 값) — 서버 없이
      # /models/runs·/models/deployed가 MlflowClient로 직접 조회한다. credential이라
      # 레포엔 값 없이 키만 선언, Render 대시보드에서 직접 입력.
      - key: MLFLOW_TRACKING_URI
        sync: false

  - type: web
    name: robustam-mlflow
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: docker/Dockerfile.mlflow
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "5000"
      # 자식 워커가 traceback을 stdout에 남기기 전에 죽는 것으로 보이는 문제를
      # 진단하기 위한 값들. 원인 특정되면 PYTHONUNBUFFERED 외 두 값은 정리 대상.
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MLFLOW_LOGGING_LEVEL
        value: "DEBUG"
      # glibc malloc arena 수를 CPU 코어 수만큼 늘리지 않도록 상한을 걸어
      # Uvicorn/psycopg2 프로세스의 상주 메모리 단편화를 줄인다.
      # (Free 플랜 RAM 512MB에서 OOM kill이 원인 후보인 상황)
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: S3_BUCKET
        value: robustam-teamkimfour
      - key: AWS_DEFAULT_REGION
        value: ap-northeast-2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: robustam-mlflow-db
          property: connectionString

databases:
  - name: robustam-mlflow-db
    plan: basic-256mb
    region: singapore
    # 팀원 각자 로컬 도커에서 이 공용 DB로 접속해야 하므로 외부 IP 허용.
    # 강력한 랜덤 패스워드로 접근 통제하고, 저장 내용은 학습 실험 메타데이터에 한정된다.
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow team local mlflow docker access
