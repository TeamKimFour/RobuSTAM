# RobuSTAM 프로덕션용 Docker Compose — fastapi + Cloudflare Tunnel
# 로컬 개발용(docker-compose.yml)의 nginx(self-signed HTTPS) 대신,
# Cloudflare Tunnel이 공인 도메인의 TLS 종단을 전담한다.
#
# 사전 준비:
#   1. Cloudflare Zero Trust 대시보드에서 Tunnel 생성 → 토큰 발급
#   2. .env.prod에 CLOUDFLARE_TUNNEL_TOKEN=<토큰> 저장 (git 커밋 금지)
#   3. TODO: 실제 도메인 확정 후 Cloudflare 대시보드에서 Public Hostname → fastapi:8000 라우팅 설정
#
# 실행: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      - ENV=production
    volumes:
      - ./config:/app/config:ro
    # 프로덕션에서는 호스트에 포트를 노출하지 않는다 — cloudflared만 내부 네트워크로 접근.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}  # TODO: .env.prod에서 주입, 실제 토큰은 아직 미발급
    depends_on:
      - fastapi

  # TODO: 실제 도메인 인증서/원본 서버 노출이 별도로 필요해지면(예: Cloudflare 우회 경로)
  # 로컬 개발용 docker-compose.yml의 nginx 서비스를 참고해 추가 검토.
  # 현재는 Cloudflare Tunnel이 공인 TLS 종단을 전담하므로 프로덕션엔 포함하지 않는다.
