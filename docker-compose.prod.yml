# RobuSTAM 프로덕션용 Docker Compose — fastapi + Cloudflare Tunnel
# 로컬 개발용(docker-compose.yml)의 nginx(self-signed HTTPS) 대신,
# Cloudflare Tunnel이 공인 도메인의 TLS 종단을 전담한다.
#
# 사전 준비:
#   1. Cloudflare Zero Trust 대시보드에서 Tunnel 생성 → 토큰 발급
#   2. .env.prod에 CLOUDFLARE_TUNNEL_TOKEN=<토큰> · S3_BUCKET/S3_PREFIX · AWS 자격증명 저장
#      (git 커밋 금지. .env.prod.example 참고)
#   3. TODO: 실제 도메인 확정 후 Cloudflare 대시보드에서 Public Hostname → fastapi:8000 라우팅 설정
#
# latest.json 수신(PR #42 논의, 옵션 b 채택): fastapi 컨테이너는 호스트와 데이터 볼륨을
# 공유하지 않는 stateless 구조라, 기동 시 + 주기적으로 S3에서 latest.json을 직접 받아온다
# (src/inference/s3_fetch.py). S3 업로드 측(daily.yml 활성화 포함)은 민지 담당.
#
# 실행: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      - ENV=production
      - PRECOMPUTE_S3_SYNC=true
      - S3_BUCKET=${S3_BUCKET}
      - S3_PREFIX=${S3_PREFIX}
      - PRECOMPUTE_SYNC_INTERVAL_SEC=${PRECOMPUTE_SYNC_INTERVAL_SEC:-300}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-northeast-2}
    volumes:
      - ./config:/app/config:ro
    # 프로덕션에서는 호스트에 포트를 노출하지 않는다 — cloudflared만 내부 네트워크로 접근.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:2025.9.1  # 민지 리뷰 반영: :latest 고정 태그로 교체(배포 시 최신 안정판 재확인)
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}  # TODO: .env.prod에서 주입, 실제 토큰은 아직 미발급
    depends_on:
      - fastapi

  # TODO: 실제 도메인 인증서/원본 서버 노출이 별도로 필요해지면(예: Cloudflare 우회 경로)
  # 로컬 개발용 docker-compose.yml의 nginx 서비스를 참고해 추가 검토.
  # 현재는 Cloudflare Tunnel이 공인 TLS 종단을 전담하므로 프로덕션엔 포함하지 않는다.
