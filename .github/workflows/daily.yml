name: Daily Feature Store

# 매일 데이터 수집 → Feature Store 빌드 → policy.zip 수신 → precompute → (설정 시) S3 업로드.
# 데일리 리밸런싱 서비스의 데이터 갱신 심장박동.
on:
  schedule:
    - cron: "0 22 * * *" # UTC 22:00 = KST 07:00 (전일 미국장 마감·데이터 확정 후)
  workflow_dispatch: {} # 수동 트리거

permissions:
  id-token: write # OIDC (S3 업로드용, role 설정 시)
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 원시 데이터 수집
        run: python -m src.data.collect

      - name: Feature Store 빌드
        run: python -m src.data.build

      # ── 이하 AWS role(vars.AWS_ROLE_ARN) 설정 시에만 실행 ──
      - name: AWS 자격증명 (OIDC)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      # policy.zip 수신 — 학습 머신이 올린 배포 policy를 config.inference.model_path
      # 위치로 내려받는다(이슈 #33, docs/data_pipeline.md §8-1). precompute가 이 파일을 로드.
      #
      # continue-on-error: 도현 리뷰(PR #47) 반영 — 이 스텝이 실패해도(예: 아직 policy.zip
      # 미업로드) 뒤의 S3 업로드(raw·feature_store)까지 막히면 안 된다. daily.yml은 데이터
      # 갱신 심장박동이 본분이라, 모델 추론 성공 여부에 그 발행을 묶지 않는다.
      - name: policy.zip 수신 (S3)
        if: vars.AWS_ROLE_ARN != ''
        continue-on-error: true
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
        run: python -m src.models.publish download

      # precompute(오늘의 추천 비중) — config.inference 값이 채워져 있어 활성화(docs §8).
      # AWS 미설정 환경(포크 등)에서는 policy.zip을 못 받아오므로 같은 조건으로 gate.
      # continue-on-error 이유는 위 policy.zip 수신 스텝과 동일(도현 리뷰).
      - name: 추천 비중 precompute
        if: vars.AWS_ROLE_ARN != ''
        continue-on-error: true
        run: python -m src.inference.precompute

      - name: S3 업로드
        if: vars.AWS_ROLE_ARN != ''
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
        run: python -m src.data.s3_sync
